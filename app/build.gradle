apply plugin: 'com.android.application'

// 发布签名：根目录存在 keystore.properties 时使用其中的正式密钥（该文件与 .jks 均不进版本库），
// 否则回退到 debug 签名，保证没有密钥的机器也能构建。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps['storeFile'] != null

android {
    namespace "com.casioemu.neo"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.casioemu.neo"
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    // .so 由外部 CMake 预编译，这里只打包
    sourceSets.main {
        jniLibs.srcDirs 'libs'
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
